  <p class="dateline">
    <span class="cat" id="catChip" data-cat="nebula">Nebula</span>
    <span class="when" id="whenLabel">Today’s photograph</span>
    <span class="rollover" id="rollover"></span>
  </p>
  <p class="notice" id="notice" role="status" hidden></p>

  <figure class="feature">
    <div class="stage loading" id="stage">
      <div class="frame" id="frame" role="button" tabindex="0" aria-label="Open immersive view">
        <img id="photo" alt="" decoding="async">
        <div class="labels" id="labels" aria-hidden="true"></div>
      </div>
      <p class="spinner" aria-hidden="true">Loading the photograph…</p>
      <span class="dims" id="dims" title="Pixel dimensions of the image asset shown here"></span>
      <div class="compare" id="compare" hidden>
        <div class="cmp-box" id="cmpBox">
          <img id="cmpLeft" alt="" decoding="async">
          <img id="cmpRight" class="top" alt="" decoding="async">
          <span class="cmp-handle" aria-hidden="true"></span>
          <span class="cmp-tag left" id="cmpLeftLabel" aria-hidden="true"></span>
          <span class="cmp-tag right" id="cmpRightLabel" aria-hidden="true"></span>
          <input type="range" id="cmpRange" min="0" max="100" step="1" value="50" aria-label="Comparison divider: drag or use arrow keys to reveal each telescope’s view">
        </div>
      </div>
    </div>
    <figcaption class="credit" id="creditLine"></figcaption>
    <figcaption class="credit" id="cmpCredit" hidden></figcaption>
    <p class="cmp-note" id="cmpNote" hidden></p>
  </figure>

  <div class="actions" role="group" aria-label="Photograph options">
    <a class="btn" id="sourceLink" href="#" target="_blank" rel="noopener">Original source <span aria-hidden="true">↗</span></a>
    <button id="immersiveBtn" type="button">Immersive view</button>
    <button id="compareBtn" type="button" aria-pressed="false" aria-controls="compare" hidden><span>Hubble vs Webb</span></button>
    <button id="tourBtn" type="button" hidden>Guided tour <span class="count" id="tourCount"></span></button>
    <button id="understandBtn" type="button" aria-pressed="false" aria-controls="understandPanel">Understand the image</button>
    <button id="favBtn" type="button" aria-pressed="false"><span id="favText">Save to favorites</span></button>
  </div>

  <div id="understandPanel" hidden tabindex="-1">
    <h3>Understanding this image</h3>
    <div id="understandBody"></div>
  </div>

  <div class="titlebar">
    <h2 id="photoTitle">Loading…</h2>
    <p class="cap" id="caption"></p>
  </div>
