<div class="finder" id="archive" role="search" aria-label="Search the collection">
  <form class="finder-form" id="archiveForm">
    <label class="finder-q"><span class="sr-only">Search the collection by name, object or constellation</span>
      <svg class="finder-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4L14 14"/></svg>
      <input type="search" id="archiveQ" placeholder="Search the collection: Orion, the Seven Sisters, NGC 1300…" autocomplete="off" enterkeyhint="search">
    </label>
    <button type="button" class="finder-toggle" id="archiveFiltersBtn" aria-expanded="false" aria-controls="archiveFilters">Filters<span class="finder-count" id="archiveFilterCount" hidden></span></button>
    <button type="button" class="finder-clear" id="archiveClear" hidden>Clear</button>
    <div class="finder-filters" id="archiveFilters" hidden>
      <label class="otd-pick"><span class="sr-only">Category</span><select id="archiveCat"></select></label>
      <label class="otd-pick"><span class="sr-only">Source</span><select id="archiveOrg"></select></label>
      <label class="otd-pick"><span class="sr-only">Telescope</span><select id="archiveTel"></select></label>
      <label class="otd-pick"><span class="sr-only">Constellation</span><select id="archiveCon"></select></label>
    </div>
  </form>
  <div class="finder-results" id="archiveResults" hidden>
    <p class="finder-note" id="archiveNote" aria-live="polite"></p>
    <div class="grid" id="archiveGrid"></div>
    <p class="more-row"><button type="button" id="archiveMore" hidden>Show more</button></p>
  </div>
</div>
