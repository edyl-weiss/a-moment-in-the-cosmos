<section id="archive" aria-labelledby="archiveHead">
  <div class="section-head">
    <div>
      <h2 id="archiveHead">Daily archive</h2>
      <p id="archiveNote"></p>
    </div>
    <div class="filters-row" role="group" aria-label="Filter archive by category">
      <button type="button" data-afilter="all" aria-pressed="true">All</button>
      <button type="button" data-afilter="galaxy" aria-pressed="false">Galaxy</button>
      <button type="button" data-afilter="nebula" aria-pressed="false">Nebula</button>
      <button type="button" data-afilter="star" aria-pressed="false">Star</button>
      <button type="button" data-afilter="night" aria-pressed="false">Night Sky</button>
    </div>
  </div>
  <div class="grid" id="archiveGrid"></div>
</section>
