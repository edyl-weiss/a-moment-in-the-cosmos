<section id="archive" aria-labelledby="archiveHead">
  <div class="section-head">
    <div>
      <h2 id="archiveHead">Daily archive</h2>
      <p id="archiveNote" aria-live="polite"></p>
    </div>
  </div>
  <form class="search" id="archiveForm" role="search" aria-label="Search the collection">
    <label class="search-q"><span class="sr-only">Search by name, object or constellation</span>
      <input type="search" id="archiveQ" placeholder="Search: Orion, Andromeda, NGC 1300…" autocomplete="off" enterkeyhint="search">
    </label>
    <label class="otd-pick"><span class="sr-only">Category</span><select id="archiveCat"></select></label>
    <label class="otd-pick"><span class="sr-only">Source</span><select id="archiveOrg"></select></label>
    <label class="otd-pick"><span class="sr-only">Telescope</span><select id="archiveTel"></select></label>
    <label class="otd-pick"><span class="sr-only">Constellation</span><select id="archiveCon"></select></label>
    <button type="button" id="archiveClear" hidden>Clear</button>
  </form>
  <div class="con-chips" id="conChips" role="group" aria-label="Browse by constellation"></div>
  <div class="grid" id="archiveGrid"></div>
  <p class="more-row"><button type="button" id="archiveMore" hidden>Show more</button></p>
</section>
