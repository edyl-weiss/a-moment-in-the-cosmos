<section id="archive" aria-labelledby="pastHead">
  <div class="section-head">
    <div>
      <h2 id="pastHead">Archive</h2>
      <p>Every photograph that’s appeared here, day by day, from the very first</p>
    </div>
    <p class="past-order" role="group" aria-label="Order">
      <button type="button" data-order="old" aria-pressed="true">Oldest first</button>
      <button type="button" data-order="new" aria-pressed="false">Newest first</button>
    </p>
  </div>
  <ol class="past" id="pastList"></ol>
</section>
