  <div class="discover" role="group" aria-labelledby="discoverHead">
    <h3 id="discoverHead">Discover another photograph</h3>
    <div class="row">
      <button type="button" data-cat="galaxy" data-random="galaxy">Random Galaxy</button>
      <button type="button" data-cat="nebula" data-random="nebula">Random Nebula</button>
      <button type="button" data-cat="star" data-random="star">Random Star</button>
      <button type="button" data-cat="night" data-random="night">Random Night Sky</button>
      <button type="button" data-random="surprise">✦ Surprise Me</button>
    </div>
    <div class="row">
      <button type="button" id="backToday" hidden>← Back to today</button>
      <button type="button" id="prevBtn" disabled>Previous image</button>
    </div>
  </div>
