<section class="signup" aria-labelledby="signupHead">
  <div>
    <h2 id="signupHead">A little of the cosmos, every day</h2>
    <p>Each new photograph and its story, delivered to your inbox. Unsubscribe anytime!</p>
  </div>
  <form id="signupForm" class="signup-form" novalidate>
    <label class="sr-only" for="signupEmail">Email address</label>
    <input type="email" id="signupEmail" name="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required>
    <input type="text" name="website" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
    <button type="submit" id="signupBtn">Subscribe</button>
  </form>
  <p class="signup-msg" id="signupMsg" role="status" aria-live="polite"></p>
</section>
<footer>
  <p><span>A Moment in the Cosmos</span><span>Images belong to the observatories and photographers credited with them.</span></p>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
