  <div class="story-grid">
    <div class="story-main">
      <div class="story" id="story"></div>
      <p class="scale name-note" id="nameBox" hidden><span class="label">Name origin:</span> <span id="nameText"></span></p>
      <div class="scale discovery" id="discBox" hidden><p><span class="label">Discovery:</span> <span id="discText"></span></p><p class="disc-year" id="discYear"></p></div>
      <p class="scale" id="scaleBox"><span class="label">Scale</span> <span id="scaleText"></span></p>
      <details class="panel" id="exploreDetails">
        <summary>Look closer</summary>
        <div class="body" id="exploreBody"></div>
      </details>
      <details class="panel" id="behindDetails">
        <summary>Behind the photograph</summary>
        <div class="body"><dl class="meta" id="behindList"></dl></div>
      </details>
    </div>
    <aside class="notes" aria-label="Photograph facts">
      <figure class="skymap" id="skyFig" hidden>
        <figcaption class="sky-head">Find it in <button type="button" id="skyCon" title="See every photograph in this constellation"></button></figcaption>
        <div class="sky-chart" id="skyChart"></div>
        <p class="sky-when" id="skyWhen"></p>
        <p class="sky-view" id="skyView"></p>
      </figure>
      <dl>
        <dt>Where to look</dt><dd id="celestial"></dd>
        <dt>Recognition</dt><dd id="recognition"></dd>
        <dt>Usage rights</dt><dd id="rights"></dd>
        <dt>Sources</dt><dd><ul id="sourcesList"></ul></dd>
      </dl>
    </aside>
  </div>
